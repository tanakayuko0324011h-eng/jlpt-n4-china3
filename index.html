<style>
:root{--bg:#f3f7f4;--ink:#16261f;--sub:#56695f;--card:#fff;--line:#d5e2da;--main:#a12b2b;--main-ink:#fff;--accent:#a8620a;--ok:#a12b2b;--front:#fff;}
@media (prefers-color-scheme:dark){:root{--bg:#1a1211;--ink:#f3e9e7;--sub:#b9a29e;--card:#271b19;--line:#43302d;--main:#ee8a80;--main-ink:#1f0c0a;--accent:#f0b25a;--ok:#f2a39a;--front:#271b19;}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 2px}
.sub{color:var(--sub);font-size:.85rem;margin:0 0 14px}
.status{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--main);transition:width .25s}
.card{perspective:1000px;height:300px;cursor:pointer;outline:none}
.card:focus-visible{outline:3px solid var(--main);outline-offset:3px;border-radius:18px}
.inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px solid var(--line);border-radius:18px;background:var(--front);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.back{transform:rotateY(180deg);background:var(--card)}
.kanji{font-size:clamp(3rem,18vw,5.5rem);line-height:1.2;font-weight:500;word-break:keep-all}
.kanji.long{font-size:clamp(2.2rem,12vw,3.6rem)}
.furi{font-size:1.35rem;color:var(--main);margin-top:6px;min-height:1.6em}
.hint{color:var(--sub);font-size:.8rem;margin-top:14px}
.word{font-size:1.5rem;margin:0}
.read{font-size:1.2rem;color:var(--main);margin:2px 0 14px}
.lang{width:100%;text-align:left;margin:4px 0;padding:8px 12px;border-radius:10px;background:var(--bg)}
.lang small{display:block;color:var(--sub);font-size:.7rem}
.lang b{font-weight:600;font-size:1.15rem}
.zh{font-family:"PingFang SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei","Heiti SC",system-ui,sans-serif}
.kanji,.word,.furi,.read{font-family:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","UD Digi Kyokasho NP-R","UD デジタル 教科書体 NP-R","YuKyokasho","Yu Kyokasho","游教科書体","Kyokasho ICA","教科書体","HGKyokashotai","HG教科書体","Klee One","Klee","Hiragino Mincho ProN","Noto Serif JP","Noto Serif CJK JP",serif}
.mark{position:absolute;top:10px;right:14px;font-size:.8rem;color:var(--ok);font-weight:700}
.row{display:flex;gap:8px;margin-top:12px}
button{flex:1;font:inherit;font-size:.95rem;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--main);outline-offset:2px}
button:active{transform:scale(.98)}
.ok{background:var(--main);color:var(--main-ink);border-color:var(--main);font-weight:700}
.no{border-color:var(--accent);color:var(--accent);font-weight:700}
.modes button[aria-pressed=true]{background:var(--main);color:var(--main-ink);border-color:var(--main)}
.note{color:var(--sub);font-size:.78rem;line-height:1.6;margin-top:18px}
.empty{padding:40px 10px;text-align:center;color:var(--sub)}
@media (prefers-reduced-motion:reduce){.inner,.bar i{transition:none}}
</style>
</head>

function render(){
  const c=$("card");
  $("known").textContent=T.known.replace("{n}",known.size);
  $("prog").style.width=(known.size/DATA.length*100)+"%";
  $("mRandom").setAttribute("aria-pressed",random);
  $("mReview").setAttribute("aria-pressed",mode==="review");
  $("mAll").setAttribute("aria-pressed",mode==="all"&&!random);
  if(!list.length){c.style.display="none";$("pos").textContent="0 / 0";
    if(!$("emptyMsg")){const d=document.createElement("div");d.id="emptyMsg";d.className="empty";d.textContent=T.empty;c.after(d)}return}
  c.style.display="";const e=$("emptyMsg");if(e)e.remove();
  const d=list[idx];
  $("pos").textContent=(idx+1)+" / "+list.length;
  const k=$("kanji");k.textContent=d.k;k.classList.toggle("long",d.k.length>3);
  const f=$("furi"),lv=d.f||0;f.textContent=(d.r!==d.k&&(fm==="all"||(fm==="mid"&&lv>=1)||(fm==="hard"&&lv>=2)))?d.r:"";
  $("word").textContent=d.k;$("read").textContent=d.r;$("en").textContent=d.e;$("bn").textContent=d.b;
  const m=known.has(d.n)?T.mark:"";$("markF").textContent=m;$("markB").textContent=m;
  c.classList.toggle("flip",flipped);
}
function furiUI(){const b=$("tFuri");b.setAttribute("aria-pressed",fm!=="off");b.textContent=T.furi+FL[fm];$("mAll").textContent=T.all.replace("{n}",DATA.length)}
function go(step){flipped=false;if(!list.length)return;idx=(idx+step+list.length)%list.length;render()}
function mark(v){
  if(!list.length)return;const d=list[idx];
  v?known.add(d.n):known.delete(d.n);save();
  if(mode==="review"&&v){list.splice(idx,1);if(idx>=list.length)idx=0;flipped=false;render()}else go(1)
}
$("card").onclick=()=>{flipped=!flipped;$("card").classList.toggle("flip",flipped)};
$("card").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("card").click()}};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("ok").onclick=()=>mark(true);$("no").onclick=()=>mark(false);
$("mRandom").onclick=()=>{random=!random;flipped=false;build();render()};
$("mReview").onclick=()=>{mode=mode==="review"?"all":"review";flipped=false;build();render()};
$("mAll").onclick=()=>{mode="all";random=false;flipped=false;build();render()};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
$("tFuri").onclick=()=>{fm=FM[(FM.indexOf(fm)+1)%FM.length];try{localStorage.setItem(KEY+"-furi",fm)}catch(e){}furiUI();render()};
furiUI();build();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
